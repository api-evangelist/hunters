aid: hunters
name: Hunters
description: >-
  Hunters is an AI-driven, next-generation SIEM and SOC platform that helps
  security operations teams do more with less by automating threat detection,
  triage, investigation, correlation, and response across an organization's
  entire security stack. It ingests data from cloud, identity, endpoint, and
  network sources (including customer-owned Snowflake and cloud data lakes),
  applies built-in detectors and threat-hunting content, and surfaces the alerts
  that matter with automated enrichment. Hunters exposes an API/webhook data
  ingestion path and outbound webhook automation recipes; the runtime API at
  api.hunters.ai is authentication-gated and no public OpenAPI is published. This
  profile was surfaced as a portfolio company of Bessemer Venture Partners and
  enriched by the API Evangelist enrichment pipeline.
